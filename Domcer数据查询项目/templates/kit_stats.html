<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职业数据统计 - 关鹏网</title>
    <style>
        :root {
            --primary: #2196F3;
            --secondary: #FF9800;
            --success: #4CAF50;
            --danger: #F44336;
            --gray: #9E9E9E;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
        }
        
        .back-button, .filter-btn {
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        .back-button:hover, .filter-btn.active {
            background-color: #1976D2;
        }
        
        .filter-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .filter-btn:hover:not(.active) {
            background-color: #e9ecef;
        }
        
        .stats-summary {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        
        .section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .section h2 {
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .time-filter {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .kit-stats-table, .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .kit-stats-table th, .kit-stats-table td,
        .leaderboard-table th, .leaderboard-table td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        
        .kit-stats-table th, .leaderboard-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #333;
            position: sticky;
            top: 0;
        }
        
        .kit-stats-table tbody tr:hover,
        .leaderboard-table tbody tr:hover {
            background-color: #f8f9fa;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        
        .search-box input {
            padding: 10px 15px;
            flex-grow: 1;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        
        .search-box button {
            padding: 10px 20px;
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .search-box button:hover {
            background-color: #F57C00;
        }
        
        .loading {
            padding: 40px;
            text-align: center;
            color: #757575;
            font-size: 16px;
        }
        
        .error {
            padding: 15px;
            background-color: #FFEBEE;
            border-radius: 8px;
            color: #F44336;
            margin-bottom: 20px;
            border-left: 4px solid #F44336;
        }
        
        @media (max-width: 768px) {
            .kit-stats-table, .leaderboard-table {
                font-size: 12px;
            }
            
            .kit-stats-table th, .kit-stats-table td,
            .leaderboard-table th, .leaderboard-table td {
                padding: 8px 10px;
            }
            
            .time-filter {
                flex-direction: column;
            }
            
            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>职业数据统计</h1>
        <div class="button-group">
            <a href="/" class="back-button">返回首页</a>
        </div>
    </div>
    
    <div class="stats-summary" id="matches-count">
        正在加载数据...
    </div>
    
    <!-- 职业数据统计部分 -->
    <div class="section">
        <h2>职业数据统计</h2>
        
        <div class="time-filter">
            <button class="filter-btn active" data-days="all">全部历史</button>
            <button class="filter-btn" data-days="30">最近一月</button>
            <button class="filter-btn" data-days="7">最近一周</button>
            <button class="filter-btn" data-days="1">最近一天</button>
        </div>
        
        <div class="table-container">
            <table class="kit-stats-table">
                <thead>
                    <tr>
                        <th>职业名称</th>
                        <th>使用次数</th>
                        <th>使用率</th>
                        <th>胜场</th>
                        <th>胜率%</th>
                        <th>MVP次数</th>
                        <th>MVP率%</th>
                        <th>平均最终击杀</th>
                        <th>平均最终助攻</th>
                        <th>平均伤害</th>
                        <th>平均承受伤害</th>
                    </tr>
                </thead>
                <tbody id="kit-stats-body">
                    <tr>
                        <td colspan="11" class="loading">正在加载职业数据...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- 职业排行榜部分 -->
    <div class="section">
        <h2>职业玩家排行榜</h2>
        
        <div class="search-box">
            <input type="text" id="kit-search" placeholder="输入职业名称，如：奥术师、僵尸、骷髅...">
            <button onclick="searchKitLeaderboard()">查询排行榜</button>
        </div>
        
        <div class="time-filter">
            <button class="filter-btn active" data-days="all">全部历史</button>
            <button class="filter-btn" data-days="30">最近一月</button>
            <button class="filter-btn" data-days="7">最近一周</button>
            <button class="filter-btn" data-days="1">最近一天</button>
        </div>
        
        <div id="leaderboard-results">
            <div class="loading">请输入职业名称查询排行榜</div>
        </div>
    </div>
    
    <script>
        let currentDaysFilter = 'all';
        let currentLeaderboardDaysFilter = 'all';
        
        // 页面加载时获取职业数据
        document.addEventListener('DOMContentLoaded', function() {
            loadKitStats('all');
            setupFilterButtons();
        });
        
        function setupFilterButtons() {
            // 职业数据筛选器
            const filterButtons = document.querySelectorAll('.section:nth-child(2) .filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentDaysFilter = this.dataset.days;
                    loadKitStats(currentDaysFilter);
                });
            });
            
            // 排行榜筛选器
            const leaderboardFilterButtons = document.querySelectorAll('.section:nth-child(3) .filter-btn');
            leaderboardFilterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    leaderboardFilterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentLeaderboardDaysFilter = this.dataset.days;
                    // 如果已经有搜索内容，重新搜索
                    const kitName = document.getElementById('kit-search').value.trim();
                    if (kitName) {
                        searchKitLeaderboard();
                    }
                });
            });
        }

        function loadKitStats(daysFilter) {
            const tbody = document.getElementById('kit-stats-body');
            tbody.innerHTML = '<tr><td colspan="11" class="loading">正在加载职业数据...</td></tr>';
            
            fetch(`/api/kit/stats?days=${daysFilter}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应不正常');
                    }
                    return response.json();
                })
                .then(data => {
                    // 更新显示信息，包含总职业出现次数
                    document.getElementById('matches-count').textContent = 
                        `已记录 ${data.total_matches} 盘游戏数据，${data.total_kit_appearances} 次职业使用`;
                    
                    if (!data.kit_stats || data.kit_stats.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="11">没有找到职业数据</td></tr>';
                        return;
                    }
                    
                    let html = '';
                    data.kit_stats.forEach(stat => {
                        html += `
                            <tr>
                                <td><strong>${stat.kit_name}</strong></td>
                                <td>${stat.total_games}</td>
                                <td>${stat.usage_rate.toFixed(1)}%</td>
                                <td>${stat.wins}</td>
                                <td>${stat.win_rate.toFixed(1)}%</td>
                                <td>${stat.mvps}</td>
                                <td>${stat.mvp_rate.toFixed(1)}%</td>
                                <td>${stat.avg_final_kills.toFixed(1)}</td>
                                <td>${stat.avg_final_assists.toFixed(1)}</td>
                                <td>${Math.round(stat.avg_damage)}</td>
                                <td>${Math.round(stat.avg_damage_taken)}</td>
                            </tr>
                        `;
                    });
                    
                    tbody.innerHTML = html;
                })
                .catch(error => {
                    console.error('加载职业数据失败:', error);
                    tbody.innerHTML = '<tr><td colspan="11" class="error">加载职业数据失败: ' + error.message + '</td></tr>';
                });
        }

        function searchKitLeaderboard() {
            const kitName = document.getElementById('kit-search').value.trim();
            if (!kitName) {
                showLeaderboardError('请输入职业名称');
                return;
            }
            
            const resultsDiv = document.getElementById('leaderboard-results');
            resultsDiv.innerHTML = '<div class="loading">正在查询排行榜...</div>';
            
            fetch(`/api/kit/leaderboard?kit=${encodeURIComponent(kitName)}&days=${currentLeaderboardDaysFilter}`)
                .then(response => {
                    if (!response.ok) {
                        // 尝试获取更详细的错误信息
                        return response.text().then(text => {
                            throw new Error(`HTTP ${response.status}: ${text}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        showLeaderboardError(data.error);
                        return;
                    }
                    
                    if (!data.leaderboard || data.leaderboard.length === 0) {
                        showLeaderboardError(`没有找到使用 "${data.kit_name}" 的玩家数据`);
                        return;
                    }
                    
                    let html = `
                        <h3>${data.kit_name} 玩家排行榜 Top${data.leaderboard.length}</h3>
                        <p>基于 ${data.total_matches} 场游戏数据</p>
                        <div class="table-container">
                            <table class="leaderboard-table">
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>玩家名称</th>
                                        <th>场数</th>
                                        <th>胜场</th>
                                        <th>胜率%</th>
                                        <th>MVP次数</th>
                                        <th>MVP率%</th>
                                        <th>场均最终击杀</th>
                                        <th>场均最终助攻</th>
                                        <th>场均伤害</th>
                                        <th>场均承伤</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    data.leaderboard.forEach((player, index) => {
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td><strong>${player.name}</strong></td>
                                <td>${player.games}</td>
                                <td>${player.wins}</td>
                                <td>${player.win_rate.toFixed(1)}%</td>
                                <td>${player.mvps}</td>
                                <td>${player.mvp_rate.toFixed(1)}%</td>
                                <td>${player.avg_final_kills.toFixed(1)}</td>
                                <td>${player.avg_final_assists.toFixed(1)}</td>
                                <td>${Math.round(player.avg_damage)}</td>
                                <td>${Math.round(player.avg_damage_taken)}</td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                    
                    resultsDiv.innerHTML = html;
                })
                .catch(error => {
                    console.error('查询排行榜失败:', error);
                    showLeaderboardError('查询排行榜失败: ' + error.message);
                });
        }
        
        function showLeaderboardError(message) {
            document.getElementById('leaderboard-results').innerHTML = 
                `<div class="error">${message}</div>`;
        }
    </script>
</body>
</html>
